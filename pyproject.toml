[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorflow"
version = "0.1.0"
description = "Vector editor with an easy layer system, smart paint bucket and measurement lines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.6",
    "PyMuPDF>=1.23",
    "shapely>=2.0",
    "numpy>=1.24",
]

[project.scripts]
vectorflow = "vectorflow.mainwindow:main"

[tool.setuptools]
packages = ["vectorflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
